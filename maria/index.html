/* Style the header */

/* Create two columns/boxes that floats next to each other */

/* Style the list inside the menu */

article {

        /* Δομή Πίνακα (Grid) - 3 στήλες σε μεγάλες οθόνες */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Στυλ για το κάθε "Κουτί" Πηγής */
        .feed-container {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .feed-title {
            font-size: 1.25em;
            font-weight: bold;
            color: #d32f2f;
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        /* Στυλ για την κάθε είδηση */
        .news-item {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .news-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f0f0f0;
            flex-shrink: 0;
        }

        .news-content { flex: 1; }

        .news-content a {
            text-decoration: none;
            color: #222;
            font-weight: 600;
            font-size: 0.95em;
            display: block;
            line-height: 1.3;
        }

        .news-content a:hover { color: #007bff; }

        .news-date {
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
            display: block;
        }
    </style>

    <script>
        // --- ΡΥΘΜΙΣΕΙΣ ---
        // Εδώ μπορείς να προσθέσεις όσες πηγές θέλεις
        const newsSources = [
            'https://dipe.ser.sch.gr/feed',   
			'https://www.minedu.gov.gr/news?format=feed&type=rss',			
			'https://fresh-education.gr/feed/',		
			'https://www.esos.gr/rss.xml',	
			'http://www.goutouloudi.gr/?feed=rss2&cat=0',
			'https://3dim-nigrit.ser.sch.gr/?feed=rss2&cat=0',
            'https://www.ertnews.gr/feed',
            'https://www.naftemporiki.gr/feed',
            'https://www.tovima.gr/feed',
            'https://news.google.com/rss?hl=el&gl=GR&ceid=GR:el',
            'https://www.newmoney.gr/category/roh/feed/',    
            'https://www.ertnews.gr/news/perifereiakoi-stathmoi/seres/feed/',
            'https://www.iefimerida.gr/rss.xml',
            'https://feeds.feedburner.com/kathimerini/DJpy',  
            'https://www.protothema.gr/rss',  
            'https://www.documentonews.gr/feed/',
            'https://epiloges.tv/feed/',
            'https://infonews24.gr/feed/',  
            'https://techmaniacs.gr/feed/',
            'https://www.pcsteps.gr/feed/',			
            'https://dypa.gov.gr/feed-pr',
            'https://www.sdna.gr/latest.xml',	
			'https://www.taxheaven.gr/bibliothiki/soft/xml/soft_new.xml'	
        ];

        const REFRESH_TIME = 60 * 60 * 1000; // 1 ώρα σε milliseconds

        // --- ΛΕΙΤΟΥΡΓΙΑ ---
        async function fetchFeeds() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = ''; // Καθαρισμός πριν την ανανέωση

            for (let i = 0; i < newsSources.length; i++) {
                // Δημιουργία του κουτιού (container) για κάθε πηγή
                const containerId = `feed-${i}`;
                grid.innerHTML += `<div id="${containerId}" class="feed-container">Φόρτωση...</div>`;
                
                loadRSS(newsSources[i], containerId);
            }
            
            const now = new Date();
            document.getElementById('last-update').innerText = `Τελευταία ενημέρωση: ${now.toLocaleTimeString('el-GR')}`;
        }

        async function loadRSS(url, containerId) {
            const api_url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            
            try {
                const response = await fetch(api_url);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    let html = `<div class="feed-title">${data.feed.title}</div>`;
                    
                    data.items.slice(0, 6).forEach(item => {
                        // Εύρεση εικόνας (thumbnail)
                        let thumb = item.thumbnail || (item.enclosure && item.enclosure.link) || 'https://via.placeholder.com/80?text=News';
                        
                        const date = new Date(item.pubDate).toLocaleString('el-GR', {
                            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        });

                        html += `
                            <div class="news-item">
                                <img src="${thumb}" alt="news">
                                <div class="news-content">
                                    <a href="${item.link}" target="_blank">${item.title}</a>
                                    <span class="news-date">📅 ${date}</span>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById(containerId).innerHTML = html;
                }
            } catch (error) {
                document.getElementById(containerId).innerHTML = "Αποτυχία φόρτωσης πηγής.";
            }
        }

        // Εκκίνηση και προγραμματισμός ανανέωσης
        fetchFeeds();
        setInterval(fetchFeeds, REFRESH_TIME);
    </script>
